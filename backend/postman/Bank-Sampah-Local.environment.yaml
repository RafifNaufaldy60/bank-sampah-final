name: Bank-Sampah-Local
values:
  - key: base_url
    value: http://localhost:3000/api
    description: Alamat HTTP backend, termasuk /api, tanpa slash terakhir. Bukan
      alamat database.
  - key: pengelola_email
    value: ""
    description: Dibuat otomatis setiap putaran dan disetujui oleh ketua.
  - key: pengelola_password
    value: <ISI_PASSWORD_PENGELOLA_SECARA_LOKAL>
    description: Password fiktif pengelola yang didaftarkan oleh collection; isi
      secara lokal.
  - key: nasabah_password
    value: <ISI_PASSWORD_NASABAH_A_SECARA_LOKAL>
    description: Password akun uji A yang akan diregistrasikan; 10–128 karakter.
  - key: nasabah_lain_password
    value: <ISI_PASSWORD_NASABAH_B_SECARA_LOKAL>
    description: Password akun uji B untuk pengujian kepemilikan; 10–128 karakter.
  - key: berat_1_kg
    value: "2.500"
    description: Berat jenis pertama setoran langsung; maksimal 3 desimal.
  - key: berat_2_kg
    value: "1.250"
    description: Berat jenis kedua setoran langsung.
  - key: berat_penjemputan_kg
    value: "10.000"
    description: Berat aktual untuk transaksi penjemputan.
  - key: run_id
    value: ""
    description: Penanda unik putaran uji; dibuat request 01.
  - key: tanggal_uji
    value: ""
