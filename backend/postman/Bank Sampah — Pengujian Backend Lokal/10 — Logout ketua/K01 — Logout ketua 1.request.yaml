$kind: http-request
description: "Hasil yang diharapkan: HTTP 200. Logout ketua 1. Hanya database pengujian."
url: "{{base_url}}/auth/logout"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_ketua_1}}"
scripts:
  - type: beforeRequest
    code: |+
      for (const key of ["token_ketua_1"]) {
        const value = pm.environment.get(key);
        if (!value || String(value).startsWith('<')) { pm.execution.skipRequest(); throw new Error('Isi variabel: ' + key); }
      }

    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Respons JSON tanpa rahasia', () => { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'); pm.expect(pm.response.text()).not.to.include('password_hash'); });
      if (pm.response.code === 200) {
        const json = pm.response.json();
        const data = json.data;
      pm.environment.set('token_ketua_1', '');
      }
    language: text/javascript
order: 23000
