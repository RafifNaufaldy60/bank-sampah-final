$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Logout berhasil; token aktif dikosongkan setelah disalin sementara untuk uji pencabutan.

  Autentikasi: token_pengelola. Prasyarat variabel: token_pengelola.
url: "{{base_url}}/auth/logout"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_pengelola}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_pengelola"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Logout berhasil dan variabel sesi dipisahkan', () => { pm.expect(data.message).to.eql('Logout berhasil.'); pm.environment.set('token_pengelola_dicabut', pm.environment.get('token_pengelola')); pm.environment.set('token_pengelola', ''); });
      }
    language: text/javascript
order: 5000
