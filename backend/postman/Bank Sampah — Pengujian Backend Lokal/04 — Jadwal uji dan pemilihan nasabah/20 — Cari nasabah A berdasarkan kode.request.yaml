$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Nasabah A yang baru dibuat dapat dipilih pada formulir setoran.

  Autentikasi: token_pengelola. Prasyarat variabel: token_pengelola, kode_nasabah, nasabah_id.
url: "{{base_url}}/nasabah?search={{kode_nasabah}}&limit=20"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_pengelola}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_pengelola","kode_nasabah","nasabah_id"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Nasabah yang dipilih ditemukan', () => { const own = data.find(row => row.id === pm.environment.get('nasabah_id')); pm.expect(Boolean(own)).to.eql(true); pm.expect(own.kode_akun).to.eql(pm.environment.get('kode_nasabah')); pm.expect(own.nama).to.eql(pm.environment.get('nasabah_nama')); });
      }
    language: text/javascript
order: 5000
