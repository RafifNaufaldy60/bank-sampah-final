$kind: http-request
description: Hanya database pengujian terpisah. Tidak menggunakan akun ketua asli.
url: "{{base_url}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (pm.environment.get('test_database_confirmed') !== 'true') { pm.execution.skipRequest(); throw new Error('Gunakan database pengujian terpisah.'); }
      if (!/^uji-lockout-[a-f0-9]+@example\.test$/.test(pm.environment.get('lockout_email') || '')) { pm.execution.skipRequest(); throw new Error('Jalankan L01; hanya akun lockout khusus yang diperbolehkan.'); }

      pm.variables.set('request_body', JSON.stringify({email:pm.environment.get('lockout_email'),password:'wrong'}));
  - type: afterResponse
    language: text/javascript
    code: >-
      pm.test('HTTP 429', () => pm.response.to.have.status(429));

      pm.test('Tidak membocorkan hash', () =>
      pm.expect(pm.response.text()).not.to.include('password_hash'));

      const error=pm.response.json().error;

      pm.test('Lockout 15 menit', () => {
      pm.expect(error.code).to.eql('LOGIN_LOCKED');
      pm.expect(error.retry_after_seconds).to.eql(900);
      pm.expect(pm.response.headers.get('Retry-After')).to.eql('900');
      pm.expect(Date.parse(error.locked_until)).not.to.be.NaN; });

      pm.environment.set('lockout_until',error.locked_until);
order: 6000
