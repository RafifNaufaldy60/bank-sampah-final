$kind: http-request
description: Hanya database pengujian terpisah. Tidak menggunakan akun ketua asli.
url: "{{base_url}}/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (pm.environment.get('test_database_confirmed') !== 'true') { pm.execution.skipRequest(); throw new Error('Gunakan database pengujian terpisah.'); }
      const run = pm.variables.replaceIn('{{$guid}}').replace(/-/g,'');
      pm.environment.set('lockout_email','uji-lockout-'+run+'@example.test');
      pm.environment.set('lockout_password',pm.variables.replaceIn('{{$guid}}'));
      pm.environment.set('lockout_until','');
      pm.variables.set('request_body', JSON.stringify({nama:'UJI LOCKOUT',email:pm.environment.get('lockout_email'),password:pm.environment.get('lockout_password'),peran:'nasabah'}));
  - type: afterResponse
    language: text/javascript
    code: >-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));

      pm.test('Tidak membocorkan hash', () =>
      pm.expect(pm.response.text()).not.to.include('password_hash'));

      pm.test('Nasabah aktif tanpa sesi', () => { const
      a=pm.response.json().data; pm.expect(a.status_akun).to.eql('active');
      pm.expect(a.is_ketua).to.eql(false); pm.expect(a.token).to.eql(undefined);
      });
order: 1000
