$kind: http-request
description: "Hasil yang diharapkan: HTTP 403. 05a — Pengelola biasa tidak dapat melihat persetujuan. Hanya database pengujian."
url: "{{base_url}}/pengajuan-pengelola"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_pengelola}}"
scripts:
  - type: beforeRequest
    code: |+
      for (const key of ["token_pengelola"]) {
        const value = pm.environment.get(key);
        if (!value || String(value).startsWith('<')) { pm.execution.skipRequest(); throw new Error('Isi variabel: ' + key); }
      }

    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('Respons JSON tanpa rahasia', () => { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'); pm.expect(pm.response.text()).not.to.include('password_hash'); });
      if (pm.response.code === 403) {
        const json = pm.response.json();
        const data = json.data;
        pm.test('Kode error', () => pm.expect(json.error.code).to.eql('AKSES_DITOLAK'));

      }
    language: text/javascript
order: 3500
