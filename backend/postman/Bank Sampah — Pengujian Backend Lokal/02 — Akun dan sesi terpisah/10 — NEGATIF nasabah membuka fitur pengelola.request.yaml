$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 403. Nasabah tidak dapat membaca ringkasan pengelola.

  Autentikasi: token_nasabah. Prasyarat variabel: token_nasabah.
url: "{{base_url}}/ringkasan"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_nasabah}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_nasabah"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      if (pm.response.code === 403) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
        pm.test('Kode error AKSES_DITOLAK', () => { pm.expect(json.error.code).to.eql('AKSES_DITOLAK'); pm.expect(json.error.message).to.be.a('string'); pm.expect(json.request_id).to.be.a('string'); });
      }
    language: text/javascript
order: 8000
