$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. data.akun.peran=nasabah; token disimpan hanya pada token_nasabah_lain.

  Autentikasi: No Auth (tanpa login). Prasyarat variabel: nasabah_lain_email, nasabah_lain_password.

  Body dibuat oleh Pre-request Script melalui variabel lokal request_body agar password berkarakter khusus tetap JSON valid dan retry tidak berubah. Bentuk input:
  ```json
  {
    "email": "{{nasabah_lain_email}}",
    "password": "{{nasabah_lain_password}}"
  }
  ```
url: "{{base_url}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["nasabah_lain_email","nasabah_lain_password"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
      // Substitusi melalui JSON.stringify juga aman untuk password yang berisi tanda kutip/backslash.
      function resolve(value) {
        if (typeof value === 'string') return pm.variables.replaceIn(value);
        if (Array.isArray(value)) return value.map(resolve);
        if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, resolve(v)]));
        return value;
      }
      const template = {
        "email": "{{nasabah_lain_email}}",
        "password": "{{nasabah_lain_password}}"
      };
      let requestBody = JSON.stringify(resolve(template), null, 2);
      pm.variables.set('request_body', requestBody);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Status aktif dan bukan ketua', () => { const akun = data.akun || data; pm.expect(akun.status_akun).to.eql('active'); pm.expect(akun.is_ketua).to.eql(false); });
      pm.test('Login memakai akun dan peran yang benar', () => {
        pm.expect(data.akun.peran).to.eql('nasabah');
        pm.expect(data.akun.email).to.eql(pm.environment.get('nasabah_lain_email').trim().toLowerCase());
        pm.expect(data.akun).not.to.have.property('password_hash');
        pm.expect(data.token_type).to.eql('Bearer');
        pm.expect(typeof data.token === 'string' && /^[A-Za-z0-9_-]{43}$/.test(data.token), 'format token').to.eql(true);
        pm.expect(Date.parse(data.expires_at) > Date.now()).to.eql(true);
        pm.expect(data.akun.id).to.eql(pm.environment.get('nasabah_lain_id'));
        pm.environment.set('nasabah_lain_id', data.akun.id); pm.environment.set('token_nasabah_lain', data.token);
      });
      }
    language: text/javascript
order: 5000
