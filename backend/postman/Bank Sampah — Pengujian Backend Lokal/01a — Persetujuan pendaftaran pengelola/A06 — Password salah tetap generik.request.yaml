$kind: http-request
description: "Hasil yang diharapkan: HTTP 401. A06 — Password salah tetap generik. Hanya database pengujian."
url: "{{base_url}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('sandi_salah', pm.variables.replaceIn('{{$guid}}'));
      for (const key of ["pengelola_email","sandi_salah"]) {
        const value = pm.environment.get(key);
        if (!value || String(value).startsWith('<')) { pm.execution.skipRequest(); throw new Error('Isi variabel: ' + key); }
      }

      const template = {"email":"{{pengelola_email}}","password":"{{sandi_salah}}"};
      function resolve(v) { if (typeof v === 'string') return pm.variables.replaceIn(v); if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k,x]) => [k, resolve(x)])); return v; }
      pm.variables.set('request_body', JSON.stringify(resolve(template)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('Respons JSON tanpa rahasia', () => { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'); pm.expect(pm.response.text()).not.to.include('password_hash'); });
      if (pm.response.code === 401) {
        const json = pm.response.json();
        const data = json.data;
        pm.test('Kode error', () => pm.expect(json.error.code).to.eql('LOGIN_GAGAL'));

      }
    language: text/javascript
order: 6000
