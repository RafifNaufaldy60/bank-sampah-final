$kind: http-request
description: "Hasil yang diharapkan: HTTP 200. A10 — Ketua 1 menyetujui pengelola. Hanya database pengujian."
url: "{{base_url}}/pengajuan-pengelola/{{pengelola_id}}/setujui"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: bearer
  credentials:
    token: "{{token_ketua_1}}"
scripts:
  - type: beforeRequest
    code: |-
      for (const key of ["token_ketua_1"]) {
        const value = pm.environment.get(key);
        if (!value || String(value).startsWith('<')) { pm.execution.skipRequest(); throw new Error('Isi variabel: ' + key); }
      }

      const template = {};
      function resolve(v) { if (typeof v === 'string') return pm.variables.replaceIn(v); if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k,x]) => [k, resolve(x)])); return v; }
      pm.variables.set('request_body', JSON.stringify(resolve(template)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Respons JSON tanpa rahasia', () => { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'); pm.expect(pm.response.text()).not.to.include('password_hash'); });
      if (pm.response.code === 200) {
        const json = pm.response.json();
        const data = json.data;
      pm.test('Disetujui dengan metadata', () => { pm.expect(data.status_akun).to.eql('active'); pm.expect(data.is_ketua).to.eql(false); pm.expect(data.diperiksa_oleh).to.eql(pm.environment.get('ketua_1_id')); pm.expect(Boolean(data.diputuskan_pada)).to.eql(true); });
      }
    language: text/javascript
order: 10000
