$kind: http-request
description: "Hasil yang diharapkan: HTTP 401. A07 — Tanpa token tidak boleh melihat pengajuan. Hanya database pengujian."
url: "{{base_url}}/pengajuan-pengelola"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |+
      for (const key of []) {
        const value = pm.environment.get(key);
        if (!value || String(value).startsWith('<')) { pm.execution.skipRequest(); throw new Error('Isi variabel: ' + key); }
      }

    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('Respons JSON tanpa rahasia', () => { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'); pm.expect(pm.response.text()).not.to.include('password_hash'); });
      if (pm.response.code === 401) {
        const json = pm.response.json();
        const data = json.data;
        pm.test('Kode error', () => pm.expect(json.error.code).to.eql('BELUM_LOGIN'));

      }
    language: text/javascript
order: 7000
