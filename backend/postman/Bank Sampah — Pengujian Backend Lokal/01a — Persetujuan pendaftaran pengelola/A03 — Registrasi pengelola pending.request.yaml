$kind: http-request
description: "Hasil yang diharapkan: HTTP 201. A03 — Registrasi pengelola pending. Hanya database pengujian."
url: "{{base_url}}/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      for (const key of ["run_id","pengelola_email","pengelola_password"]) {
        const value = pm.environment.get(key);
        if (!value || String(value).startsWith('<')) { pm.execution.skipRequest(); throw new Error('Isi variabel: ' + key); }
      }

      const template = {"nama":"POSTMAN UJI pengelola {{run_id}}","email":"{{pengelola_email}}","password":"{{pengelola_password}}","peran":"pengelola"};
      function resolve(v) { if (typeof v === 'string') return pm.variables.replaceIn(v); if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k,x]) => [k, resolve(x)])); return v; }
      pm.variables.set('request_body', JSON.stringify(resolve(template)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('Respons JSON tanpa rahasia', () => { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'); pm.expect(pm.response.text()).not.to.include('password_hash'); });
      if (pm.response.code === 201) {
        const json = pm.response.json();
        const data = json.data;
      pm.test('Pengajuan tanpa token', () => { pm.expect(data.peran).to.eql('pengelola'); pm.expect(data.is_ketua).to.eql(false); pm.expect(data.status_akun).to.eql('pending'); pm.expect(data).not.to.have.property('token'); pm.expect(json).not.to.have.property('token'); }); pm.environment.set('pengelola_id', data.id);
      }
    language: text/javascript
order: 3000
