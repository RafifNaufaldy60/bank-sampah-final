$kind: http-request
description: "Hasil yang diharapkan: HTTP 200. A02 — Login ketua 2. Hanya database pengujian."
url: "{{base_url}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      for (const key of ["ketua_2_email","ketua_2_password"]) {
        const value = pm.environment.get(key);
        if (!value || String(value).startsWith('<')) { pm.execution.skipRequest(); throw new Error('Isi variabel: ' + key); }
      }

      const template = {"email":"{{ketua_2_email}}","password":"{{ketua_2_password}}"};
      function resolve(v) { if (typeof v === 'string') return pm.variables.replaceIn(v); if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k,x]) => [k, resolve(x)])); return v; }
      pm.variables.set('request_body', JSON.stringify(resolve(template)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Respons JSON tanpa rahasia', () => { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'); pm.expect(pm.response.text()).not.to.include('password_hash'); });
      if (pm.response.code === 200) {
        const json = pm.response.json();
        const data = json.data;
      pm.test('Ketua aktif', () => { pm.expect(data.akun.peran).to.eql('pengelola'); pm.expect(data.akun.is_ketua).to.eql(true); pm.expect(data.akun.status_akun).to.eql('active'); pm.expect(data.token).to.match(/^[A-Za-z0-9_-]{43}$/); });
      pm.environment.set('token_ketua_2', data.token); pm.environment.set('ketua_2_id', data.akun.id);
      }
    language: text/javascript
order: 2000
