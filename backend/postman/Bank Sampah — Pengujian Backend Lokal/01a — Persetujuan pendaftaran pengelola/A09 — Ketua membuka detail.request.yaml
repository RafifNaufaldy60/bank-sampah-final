$kind: http-request
description: "Hasil yang diharapkan: HTTP 200. A09 — Ketua membuka detail. Hanya database pengujian."
url: "{{base_url}}/pengajuan-pengelola/{{pengelola_id}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_ketua_2}}"
scripts:
  - type: beforeRequest
    code: |+
      for (const key of ["token_ketua_2"]) {
        const value = pm.environment.get(key);
        if (!value || String(value).startsWith('<')) { pm.execution.skipRequest(); throw new Error('Isi variabel: ' + key); }
      }

    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Respons JSON tanpa rahasia', () => { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'); pm.expect(pm.response.text()).not.to.include('password_hash'); });
      if (pm.response.code === 200) {
        const json = pm.response.json();
        const data = json.data;
      pm.test('Detail pending yang benar', () => { pm.expect(data.id).to.eql(pm.environment.get('pengelola_id')); pm.expect(data.status_akun).to.eql('pending'); });
      }
    language: text/javascript
order: 9000
