$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Daftar boleh kosong. Baris tersedia/tutup menggunakan tanggal WIB yang diminta.

  Autentikasi: No Auth (tanpa login). Prasyarat variabel: tanggal_uji.
url: "{{base_url}}/jadwal?dari={{tanggal_uji}}&sampai={{tanggal_uji}}&limit=100"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["tanggal_uji"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Format daftar jadwal dan pagination benar', () => { pm.expect(data).to.be.an('array'); pm.expect(json.meta.total).to.be.a('number'); for (const row of data) { pm.expect(row.tanggal).to.eql(pm.environment.get('tanggal_uji')); pm.expect(row.status).to.eql(row.tersedia ? 'tersedia' : 'tutup'); } });
      }
    language: text/javascript
order: 5000
