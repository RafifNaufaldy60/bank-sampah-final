$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Tarif positif dalam Rp/kg; simpan harga_kedua_per_kg untuk memeriksa subtotal.

  Autentikasi: No Auth (tanpa login). Prasyarat variabel: tanggal_uji, jenis_sampah_kedua_id.
url: "{{base_url}}/jenis-sampah/{{jenis_sampah_kedua_id}}/harga?tanggal={{tanggal_uji}}"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["tanggal_uji","jenis_sampah_kedua_id"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Tarif tanggal yang dipilih tersedia', () => { pm.expect(String(data.id)).to.eql(pm.environment.get('jenis_sampah_kedua_id')); pm.expect(data.status_tarif).to.eql('tersedia'); pm.expect(BigInt(data.harga_per_kg) > 0n).to.eql(true); pm.expect(json.meta.tanggal).to.eql(pm.environment.get('tanggal_uji')); pm.environment.set('harga_kedua_per_kg', data.harga_per_kg); });
      }
    language: text/javascript
order: 3000
