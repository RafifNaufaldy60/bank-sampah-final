$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Daftar jenis/panduan/satuan kg. Pilih dua jenis berbeda yang memiliki tarif; jenis tanpa tarif tetap boleh tampil.

  Autentikasi: No Auth (tanpa login). Prasyarat variabel: tanggal_uji.
url: "{{base_url}}/jenis-sampah?tanggal={{tanggal_uji}}"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["tanggal_uji"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Katalog lengkap dan memiliki dua tarif untuk uji multijenis', () => {
        pm.expect(data).to.be.an('array'); pm.expect(json.meta.tanggal).to.eql(pm.environment.get('tanggal_uji'));
        pm.expect(json.meta.zona_waktu).to.eql('Asia/Jakarta');
        for (const item of data) { pm.expect(item.satuan).to.eql('kg'); pm.expect(item.panduan).to.be.a('string'); if (item.harga_per_kg === null) pm.expect(item.status_tarif).to.eql('belum_ditetapkan'); }
        const priced = data.filter(item => item.status_tarif === 'tersedia' && BigInt(item.harga_per_kg) > 0n);
        pm.expect(priced.length >= 2, 'Sedikitnya dua jenis perlu memiliki tarif').to.eql(true);
        pm.environment.set('jenis_sampah_id', String(priced[0].id)); pm.environment.set('harga_per_kg', priced[0].harga_per_kg);
        pm.environment.set('jenis_sampah_kedua_id', String(priced[1].id)); pm.environment.set('harga_kedua_per_kg', priced[1].harga_per_kg);
      });
      }
    language: text/javascript
order: 1000
