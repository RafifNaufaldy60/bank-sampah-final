$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Hanya transaksi milik A; setoran langsung muncul tepat satu kali pada hasil uji.

  Autentikasi: token_nasabah. Prasyarat variabel: token_nasabah, nasabah_id, transaksi_id.
url: "{{base_url}}/setoran?periode=bulan_ini&limit=100"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_nasabah}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_nasabah","nasabah_id","transaksi_id"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Riwayat milik A tanpa transaksi duplikat', () => { for (const row of data) pm.expect(row.nasabah_id).to.eql(pm.environment.get('nasabah_id')); pm.expect(data.filter(row => row.setoran_id === pm.environment.get('transaksi_id')).length).to.eql(1); pm.expect(json.meta.zona_waktu).to.eql('Asia/Jakarta'); });
      }
    language: text/javascript
order: 7000
