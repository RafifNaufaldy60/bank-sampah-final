$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Saldo awal disimpan tanpa asumsi harus nol. Snapshot tidak ditimpa jika request diklik ulang setelah transaksi.

  Autentikasi: token_nasabah. Prasyarat variabel: token_nasabah, nasabah_id.
url: "{{base_url}}/saldo"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_nasabah}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_nasabah","nasabah_id"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Saldo milik A dan snapshot awal tersimpan', () => {
        pm.expect(data.nasabah_id).to.eql(pm.environment.get('nasabah_id')); pm.expect(data.saldo_rp).to.match(/^[0-9]+$/);
        pm.expect(json.meta.periode_saldo).to.eql('sepanjang_waktu');
        if (pm.environment.get('saldo_awal') === '') { pm.environment.set('saldo_awal', data.saldo_rp); pm.environment.set('berat_awal', data.total_kg); }
      });
      }
    language: text/javascript
order: 1000
