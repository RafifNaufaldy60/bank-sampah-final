$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Identitas pengelola sesuai sesi; metrik hari ini mencakup dua transaksi, tetapi boleh juga memuat data pengguna lain.

  Autentikasi: token_pengelola. Prasyarat variabel: token_pengelola, nilai_setoran, nilai_setoran_penjemputan, tanggal_uji.
url: "{{base_url}}/ringkasan"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_pengelola}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_pengelola","nilai_setoran","nilai_setoran_penjemputan","tanggal_uji"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Identitas dan periode ringkasan sesuai', () => { pm.expect(data.pengelola.id).to.eql(pm.environment.get('pengelola_id')); pm.expect(data.periode.zona_waktu).to.eql('Asia/Jakarta'); pm.expect(data.metrik.hari_ini).to.eql(pm.environment.get('tanggal_uji')); pm.expect(BigInt(data.metrik.nilai_hari_ini_rp) >= BigInt(pm.environment.get('nilai_setoran')) + BigInt(pm.environment.get('nilai_setoran_penjemputan'))).to.eql(true); pm.expect(BigInt(data.metrik.nasabah_aktif) >= 2n).to.eql(true); pm.expect(data.transaksi_terbaru).to.be.an('array'); pm.expect(data.jadwal_hari_ini).to.be.an('array'); });
      }
    language: text/javascript
order: 3000
