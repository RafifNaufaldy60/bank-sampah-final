$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. Satu baris pada halaman 1; total hasil filter=2, total_pages=2. Simpan jumlah ekspor yang diharapkan.

  Autentikasi: token_pengelola. Prasyarat variabel: token_pengelola, kode_nasabah, tanggal_uji, transaksi_id, transaksi_penjemputan_id.
url: "{{base_url}}/setoran?search={{kode_nasabah}}&dari={{tanggal_uji}}&sampai={{tanggal_uji}}&page=1&limit=1"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_pengelola}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_pengelola","kode_nasabah","tanggal_uji","transaksi_id","transaksi_penjemputan_id"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Pagination tetap menghitung seluruh hasil filter', () => { pm.expect(json.meta.page).to.eql(1); pm.expect(json.meta.limit).to.eql(1); pm.expect(json.meta.total).to.eql(2); pm.expect(json.meta.total_pages).to.eql(2); pm.expect(data.length).to.eql(1); pm.expect(data[0].nasabah_id).to.eql(pm.environment.get('nasabah_id')); pm.expect(data[0].setoran_id).to.eql(pm.environment.get('transaksi_penjemputan_id')); pm.environment.set('jumlah_ekspor_diharapkan', String(json.meta.total)); });
      }
    language: text/javascript
order: 1000
