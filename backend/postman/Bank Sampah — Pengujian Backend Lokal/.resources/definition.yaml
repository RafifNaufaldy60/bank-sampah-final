$kind: collection
description: Pengujian database terpisah. Jalankan folder 01, 01a, 02–09, 10 sesuai order. Bootstrap tepat dua ketua uji dahulu; pengelola biasa diregistrasikan dan disetujui dalam collection. Isi ketua_1/2_email, ketua_1/2_password serta password pengelola dan dua nasabah lokal. Request 01 membuat identitas unik dan mereset token/ID. Jangan ulangi 01 di tengah putaran. Lihat docs/POSTMAN.md.
scripts:
  - type: http:beforeRequest
    code: |-
      const base = pm.environment.get('base_url');
      if (!base || !(base.startsWith('http://') || base.startsWith('https://')) || !base.endsWith('/api')) {
        pm.execution.skipRequest();
        throw new Error('Pilih environment Bank-Sampah-Local dan isi base_url berakhiran /api tanpa slash terakhir.');
      }
      if (pm.environment.get('test_database_confirmed') !== 'true') { pm.execution.skipRequest(); throw new Error('Pastikan backend memakai database pengujian lalu isi test_database_confirmed=true.'); }
    language: text/javascript
auth:
  - id: ""
    type: noauth
    name: No Auth
