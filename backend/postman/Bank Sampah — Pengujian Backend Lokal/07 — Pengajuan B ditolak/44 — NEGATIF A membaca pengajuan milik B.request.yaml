$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 404. Pemeriksaan kepemilikan juga berlaku untuk pengajuan.

  Autentikasi: token_nasabah. Prasyarat variabel: token_nasabah, pengajuan_tolak_id.
url: "{{base_url}}/pengajuan-penjemputan/{{pengajuan_tolak_id}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_nasabah}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_nasabah","pengajuan_tolak_id"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      if (pm.response.code === 404) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
        pm.test('Kode error TIDAK_DITEMUKAN', () => { pm.expect(json.error.code).to.eql('TIDAK_DITEMUKAN'); pm.expect(json.error.message).to.be.a('string'); pm.expect(json.request_id).to.be.a('string'); });
      }
    language: text/javascript
order: 4000
