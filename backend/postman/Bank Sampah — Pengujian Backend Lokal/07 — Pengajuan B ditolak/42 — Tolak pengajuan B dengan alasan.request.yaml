$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. status=ditolak; alasan, ID pengelola, dan diproses_pada terisi; tidak menghasilkan transaksi.

  Autentikasi: token_pengelola. Prasyarat variabel: token_pengelola, pengajuan_tolak_id, pengajuan_id, run_id.

  Body dibuat oleh Pre-request Script melalui variabel lokal request_body agar password berkarakter khusus tetap JSON valid dan retry tidak berubah. Bentuk input:
  ```json
  {
    "catatan_pengelola": "POSTMAN UJI DITOLAK: alamat fiktif di luar area {{run_id}}"
  }
  ```
url: "{{base_url}}/pengajuan-penjemputan/{{pengajuan_tolak_id}}/tolak"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: bearer
  credentials:
    token: "{{token_pengelola}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_pengelola","pengajuan_tolak_id","pengajuan_id","run_id"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
      if (pm.environment.get('pengajuan_tolak_id') === pm.environment.get('pengajuan_id')) { pm.execution.skipRequest(); throw new Error('Pengajuan penolakan harus berbeda.'); }
      // Substitusi melalui JSON.stringify juga aman untuk password yang berisi tanda kutip/backslash.
      function resolve(value) {
        if (typeof value === 'string') return pm.variables.replaceIn(value);
        if (Array.isArray(value)) return value.map(resolve);
        if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, resolve(v)]));
        return value;
      }
      const template = {
        "catatan_pengelola": "POSTMAN UJI DITOLAK: alamat fiktif di luar area {{run_id}}"
      };
      let requestBody = JSON.stringify(resolve(template), null, 2);
      pm.variables.set('request_body', requestBody);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Penolakan memakai pengajuan terpisah', () => { pm.expect(data.id).to.eql(pm.environment.get('pengajuan_tolak_id')); pm.expect(data.id).not.to.eql(pm.environment.get('pengajuan_id')); pm.expect(data.nasabah_id).to.eql(pm.environment.get('nasabah_lain_id')); pm.expect(data.status).to.eql('ditolak'); pm.expect(data.catatan_pengelola).to.include('DITOLAK'); pm.expect(data.pengelola_id).to.eql(pm.environment.get('pengelola_id')); pm.expect(Number.isFinite(Date.parse(data.diproses_pada))).to.eql(true); pm.expect(data.setoran_id).to.eql(null); });
      }
    language: text/javascript
order: 2000
