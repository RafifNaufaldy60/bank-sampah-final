$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 201. status=menunggu, pemilik berasal dari sesi; simpan pengajuan_tolak_id yang harus berbeda dari pengajuan_id.

  Autentikasi: token_nasabah_lain. Prasyarat variabel: token_nasabah_lain, tanggal_uji, run_id, berat_penjemputan_kg, nasabah_lain_id.

  Body dibuat oleh Pre-request Script melalui variabel lokal request_body agar password berkarakter khusus tetap JSON valid dan retry tidak berubah. Bentuk input:
  ```json
  {
    "alamat_penjemputan": "ALAMAT FIKTIF POSTMAN UJI B {{run_id}}",
    "nomor_whatsapp": "081234567890",
    "tanggal_diminta": "{{tanggal_uji}}",
    "perkiraan_berat_kg": "{{berat_penjemputan_kg}}",
    "catatan_nasabah": "POSTMAN UJI TOLAK {{run_id}}"
  }
  ```
url: "{{base_url}}/pengajuan-penjemputan"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{{request_body}}"
auth:
  type: bearer
  credentials:
    token: "{{token_nasabah_lain}}"
scripts:
  - type: beforeRequest
    code: |-
      const required = ["token_nasabah_lain","tanggal_uji","run_id","berat_penjemputan_kg","nasabah_lain_id"];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
      // Substitusi melalui JSON.stringify juga aman untuk password yang berisi tanda kutip/backslash.
      function resolve(value) {
        if (typeof value === 'string') return pm.variables.replaceIn(value);
        if (Array.isArray(value)) return value.map(resolve);
        if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, resolve(v)]));
        return value;
      }
      const template = {
        "alamat_penjemputan": "ALAMAT FIKTIF POSTMAN UJI B {{run_id}}",
        "nomor_whatsapp": "081234567890",
        "tanggal_diminta": "{{tanggal_uji}}",
        "perkiraan_berat_kg": "{{berat_penjemputan_kg}}",
        "catatan_nasabah": "POSTMAN UJI TOLAK {{run_id}}"
      };
      let requestBody = JSON.stringify(resolve(template), null, 2);
      pm.variables.set('request_body', requestBody);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Pengajuan menunggu milik akun yang benar', () => { pm.expect(data.status).to.eql('menunggu'); pm.expect(data.nasabah_id).to.eql(pm.environment.get('nasabah_lain_id')); pm.expect(data.jadwal_layanan_id).to.eql(null); pm.expect(data.pengelola_id).to.eql(null); pm.expect(data.id).not.to.eql(pm.environment.get('pengajuan_id')); pm.environment.set('pengajuan_tolak_id', data.id); });
      }
    language: text/javascript
order: 1000
