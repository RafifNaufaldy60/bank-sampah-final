$kind: http-request
description: |-
  Hasil yang diharapkan: HTTP 200. status=ok. Membuat run_id, tanggal Jakarta, email/nama nasabah, dan UUID permintaan. Jangan ulangi request ini di tengah putaran.

  Autentikasi: No Auth (tanpa login). 
url: "{{base_url}}/health"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = [];
      for (const key of required) {
        const value = pm.environment.get(key);
        if (value === undefined || value === null || value === '' || String(value).startsWith('<')) {
          pm.execution.skipRequest(); throw new Error('Isi variabel lokal atau jalankan request sebelumnya: ' + key);
        }
        if (key.endsWith('_password') && (String(value).length < 10 || String(value).length > 128)) {
          pm.execution.skipRequest(); throw new Error('Password harus 10–128 karakter; periksa ' + key);
        }
      }
      for (const key of ["run_id","tanggal_uji","nasabah_nama","nasabah_email","nasabah_lain_nama","nasabah_lain_email","pengelola_id","nasabah_id","kode_nasabah","nasabah_lain_id","jenis_sampah_id","jenis_sampah_kedua_id","harga_per_kg","harga_kedua_per_kg","jadwal_setoran_id","jadwal_id","transaksi_id","kode_transaksi","transaksi_penjemputan_id","pengajuan_id","pengajuan_tolak_id","saldo_awal","berat_awal","nilai_setoran","berat_setoran","nilai_setoran_penjemputan","berat_setoran_penjemputan","kunci_permintaan","kunci_permintaan_invalid","kunci_permintaan_penjemputan","body_setoran","body_setoran_penjemputan","jumlah_ekspor_diharapkan","token_pengelola","token_nasabah","token_nasabah_lain","token_pengelola_dicabut","token_nasabah_dicabut","token_nasabah_lain_dicabut"]) pm.environment.set(key, '');
      const run = pm.variables.replaceIn('{{$guid}}').replace(/-/g, '');
      pm.environment.set('run_id', run);
      pm.environment.set('tanggal_uji', new Date(Date.now() + 7 * 60 * 60 * 1000).toISOString().slice(0, 10));
      pm.environment.set('nasabah_nama', 'POSTMAN UJI A ' + run);
      pm.environment.set('nasabah_lain_nama', 'POSTMAN UJI B ' + run);
      pm.environment.set('nasabah_email', 'uji-postman-a-' + run + '@example.test');
      pm.environment.set('nasabah_lain_email', 'uji-postman-b-' + run + '@example.test');
      for (const key of ['kunci_permintaan','kunci_permintaan_invalid','kunci_permintaan_penjemputan']) pm.environment.set(key, pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Respons berupa JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
        const json = pm.response.json();
        const data = json.data;
      pm.test('Server terhubung ke database', () => { pm.expect(json.status).to.eql('ok'); pm.expect(json.message).to.include('PostgreSQL'); });
      }
    language: text/javascript
order: 1000
